<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rustwing Audio Bench</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; padding: 16px; background: #0b0912; color: #e8e2d0; font: 14px/1.4 ui-monospace, Menlo, monospace; }
      h1 { font-size: 18px; margin: 0 0 12px; color: #ffb347; }
      h2 { font-size: 13px; margin: 18px 0 6px; color: #9fd8c8; text-transform: uppercase; letter-spacing: 0.08em; }
      .row { display: flex; flex-wrap: wrap; gap: 6px; }
      button { background: #221d2e; color: #e8e2d0; border: 1px solid #3d3450; padding: 6px 10px; font: inherit; cursor: pointer; border-radius: 3px; }
      button:hover { background: #2f2840; border-color: #ffb347; }
      button.on { background: #ffb347; color: #0b0912; }
      label { display: inline-flex; align-items: center; gap: 6px; margin-right: 16px; }
      input[type='range'] { width: 140px; }
      #status { color: #8a8399; margin-left: 8px; }
    </style>
  </head>
  <body>
    <h1>Rustwing Raiders: audio bench <span id="status">(click anything to unlock)</span></h1>
    <div>
      <label>master <input id="vMaster" type="range" min="0" max="1" step="0.01" value="1" /></label>
      <label>music <input id="vMusic" type="range" min="0" max="1" step="0.01" value="0.8" /></label>
      <label>sfx <input id="vSfx" type="range" min="0" max="1" step="0.01" value="1" /></label>
      <button id="mute">mute</button>
    </div>
    <div style="margin-top: 8px">
      <label>intensity <input id="inten" type="range" min="0" max="1" step="0.01" value="0" /> <span id="intenV">0.00</span></label>
      <label>pan <input id="pan" type="range" min="-1" max="1" step="0.05" value="0" /></label>
      <label>pitch <input id="pitch" type="range" min="0.5" max="2" step="0.05" value="1" /></label>
      <button id="duck">duck 1.5s</button>
    </div>
    <div style="margin-top: 8px">
      <label>distance <input id="dist" type="range" min="0" max="1" step="0.05" value="0" /></label>
      <label>danger (low hull) <input id="danger" type="range" min="0" max="1" step="0.01" value="0" /></label>
      <button id="muffle">pause muffle</button>
      <span id="meter" style="margin-left: 12px; color: #9fd8c8"></span>
    </div>
    <h2>Music</h2>
    <div class="row" id="tracks"></div>
    <h2>Places (ambience + reverb; intensity pulls flight places back)</h2>
    <div class="row" id="places"></div>
    <h2>Loops (owner p1; slider = intensity)</h2>
    <div class="row" id="loops"></div>
    <h2>Stress</h2>
    <div class="row" id="stress"></div>
    <h2>Sfx</h2>
    <div class="row" id="sfx"></div>
    <script type="module" src="/src/audio-test.ts"></script>
  </body>
</html>
